#!/usr/sbin/nft -f

# Flush existing rules
flush ruleset

# Define tables
table inet filter {
    # Define sets for allowed services
    set tcp_accepted {
        type inet_service
        elements = { 22, 80, 443, 5432 }
    }

    set udp_accepted {
        type inet_service
        elements = { 53 }
    }

    # INPUT chain - traffic to the firewall itself
    chain input {
        type filter hook input priority 0; policy drop;

        # Accept established/related connections
        ct state established,related accept

        # Accept loopback
        iif lo accept

        # Accept ICMP (ping)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Accept SSH for management
        tcp dport 22 ct state new accept

        # Log dropped packets
        log prefix "[FW-INPUT-DROP] " drop
    }

    # FORWARD chain - traffic passing through the firewall
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Accept established/related connections
        ct state established,related accept

        # RULE 1: nginx01 → web01 (DMZ to Internal HTTPS API)
        # nginx01 (172.18.0.4) → web01 (172.18.0.3) port 3000
        ip saddr 172.18.0.4 ip daddr 172.18.0.3 tcp dport 3000 ct state new accept

        # RULE 2: web01 → db01 (Internal PostgreSQL mTLS)
        # web01 (172.19.0.5) → db01 (172.19.0.3) port 5432
        ip saddr 172.19.0.5 ip daddr 172.19.0.3 tcp dport 5432 ct state new accept

        # RULE 3: Allow internal DNS queries (if needed)
        ip saddr 172.19.0.0/16 udp dport 53 ct state new accept
        ip saddr 172.19.0.0/16 tcp dport 53 ct state new accept

        # BLOCK RULES (explicit denies with logging)
        
        # Block direct DMZ → database access
        ip saddr 172.18.0.0/16 ip daddr 172.19.0.3 tcp dport 5432 log prefix "[FW-DENY-DMZ-DB] " drop

        # Block ALL access to CA (ca01) - manual operations only
        ip daddr 172.19.0.2 log prefix "[FW-DENY-CA-ACCESS] " drop

        # Log all other dropped forward packets
        log prefix "[FW-DENY-FORWARD] " drop
    }

    # OUTPUT chain - traffic from the firewall itself
    chain output {
        type filter hook output priority 0; policy accept;

        # Allow all outbound from firewall
    }
}

# NAT table (if needed for port forwarding)
table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100;
        
        # Port forwarding: external 443 -> nginx:443
        # tcp dport 443 dnat to 172.18.0.2:443
    }

    chain postrouting {
        type nat hook postrouting priority 100;
        
        # Masquerade for outbound traffic (if needed)
        # oifname "eth0" masquerade
    }
}
